spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-postgres-settings.sql
  datasource:
    url: jdbc:h2:mem:linkro;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
auth:
  kakao:
    app-id: 1234
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC0wMTIzNDU2Nzg5YWJjZGVmZ2hpams=
    access-token-ttl: 15m
linkro:
  holiday:
    kasi:
      # Tests never call the real KASI API, even when .env or the shell has KASI_SPECIAL_DAY_KEY.
      service-key: ""
  route:
    kakao:
      # Tests never call the real Kakao API, even when .env or the shell has KAKAO_REST_API_KEY.
      # Kakao tests build their own client against a stub server.
      rest-api-key: ""
