# Transfer times of the timetable routes (TimetableRouter, #151): linkro.subway.timetable.transfer-overrides.
# Each entry replaces the seconds of the TRANSFER edges between two lines at one station, both directions. Pairs not
# listed keep the seed seconds (station_connections.travel_seconds, the walking time of data.go.kr 15044419, about
# 1.2 m/s). Distances are not changed. The fixed-cost graph (Dijkstra) and the seed (V11) do not use this file.
#
# Meaning: 카카오맵's transfer time ("환승 소요"). In the code it takes the place of the seed's walking seconds; the wait
# for the next train is still added by the router after it. Whether 카카오맵's value includes some wait is unknown.
#
# Source: 카카오맵 app, subway tab, weekday 2026-11-16 20:31~20:51, departure set as "출발": the minutes shown for the
# part between two trains, x 60 s (whole minutes, so +-30 s). 노원 was read at several times and both directions (always
# 8 minutes); the other stations once, one direction.
# The last 6 entries were not shown on the subway tab and are estimated defaults: the larger of
# max(120 s, seed x 1.3 + 60 s) (decimals dropped) and the walking tab's minutes x 60 s (a lower bound only).
#
# station is the stored station name (stations.name), from-line and to-line are line codes. TimetableRouter checks every
# entry against the graph at startup and fails on an unknown station or line, a pair without TRANSFER edges, a repeated
# pair or negative seconds. TransferOverridesPostgresTest checks that the entries cover the 78 TRANSFER rows of the
# migrated database (39 pairs x 2 directions).

