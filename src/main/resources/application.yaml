spring:
  application:
    name: linkro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkro}
    username: ${DB_USERNAME:linkro}
    password: ${DB_PASSWORD:linkro}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

auth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    base-url: ${KAKAO_BASE_URL:https://kapi.kakao.com}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}
  jwt:
    secret: ${JWT_SECRET}
    # Spring Duration: 15m locally, 30m in production.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    # Each rotation restarts this lifetime from the time of reissue.
    refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    # The JDK HTTP client behind RestClient (SimpleClientHttpRequestFactory -> HttpURLConnection) logs whole request
    # lines at FINE/FINEST, and the Seoul arrival API carries its key in the URL path. Keep these at INFO or above
    # (checked by HttpClientLoggingLevelTest, docs/arrivals-86.md).
    sun.net.www: INFO

# Subway module. Unset values mean mock, and each mock logs a WARN at startup.
# - module: mock | graph. graph loads the subway graph at startup for real routes and fares
#   (production: environment variable LINKRO_SUBWAY_MODULE=graph).
# - congestion: mock | db. db reads congestion_stats for route congestion; turn it on after the production DB is
#   loaded (environment variable LINKRO_SUBWAY_CONGESTION=db). GET /congestion reads the DB either way.
# - holidays: comma-separated yyyy-MM-dd used as SUNDAY; defaults are in subway-holidays.properties.
#   With KASI_SPECIAL_DAY_KEY (linkro.holiday.kasi.service-key, data.go.kr "Decoding" key) this year and next year
#   are refreshed from the KASI special-day API on startup (background) and daily at 03:00 KST; a year is replaced
#   only when all 12 months succeed. Optional: linkro.holiday.kasi.base-url, connect-timeout=2s, read-timeout=3s.
#   See docs/holiday-refresh-83.md.
# Train arrivals (GET /stations/{id}/arrivals): key from SEOUL_ARRIVAL_API_KEY (linkro.arrival.seoul.api-key);
#   empty means available=false (DISABLED). Optional: linkro.arrival.seoul.base-url, timeout=3s,
#   linkro.arrival.cache-ttl=15s, failure-cache-ttl=5s. See docs/arrivals-86.md.
# Route search (POST /routes/search): the Kakao REST API key comes only from the environment variable
# KAKAO_REST_API_KEY (production: ~/BE/.env, passed by docker-compose). Empty means INTERNAL routes only.
# Optional overrides (defaults shown): linkro.route.kakao.base-url=https://dapi.kakao.com,
#   call-timeout=3s, total-timeout=5s, retry-delay=200ms. See docs/route-search-81.md.
# - timetable.enabled (default true, module=graph only): recommendations use real trains of train-timetable.csv.gz
#   (#96). false loads no timetable and goes back to the fixed costs below (emergency switch).
#   timetable.station-access-seconds (default 0): time from leaving to the first platform. See docs/recommendation-74.md.
#   timetable.no-service-window-minutes (default 60): no train arriving this long before the appointment -> NO_SERVICE_TIME.
# - Recommendation fares come from fare-table.csv.gz (Seoul Metro fare table by station pair, adult transit card, #109)
#   when module=graph; without it or for a missing pair, from the ridden distance. See docs/recommendation-74.md.
# - graph.* and fare.* apply only with module=graph; defaults are in subway-graph-defaults.properties
#   (docs/subway-graph-69.md lists them).
# linkro:
#   subway:
#     module: mock
#     congestion: mock
#     # 기본값은 subway-graph-defaults.properties 기준
#     graph:
#       dwell-seconds: 30
#       transfer-wait-seconds: 120
#       branch-transfer-wait-seconds: 120
#       default-branch-transfer-seconds: 120
#       branch-transfers:
#         - { station: 성수, line: "2", seconds: 19, meters: 23 }
#     fare:
#       base-fare: 1550

# AI module (#73). Unset or blank means mock, which logs a WARN at startup.
# - module: mock | openai (production: LINKRO_AI_MODULE=openai).
# - openai with a blank OPENAI_API_KEY or OPENAI_MODEL fails startup. There is no default model id.
# - explain-read-timeout (OPENAI_EXPLAIN_READ_TIMEOUT, default 6s) applies only to recommendation explanations (#99);
#   past it the recommendation answers with template sentences. read-timeout stays for condition parsing and chat,
#   vision-read-timeout for signs. 실제 응답 시간은 타이밍 로그의 explain 값을 보고 조정한다
#   ("Recommendation timing: ... explain=…ms").
# - The timeouts come from ~/BE/.env through docker-compose; an empty value keeps these defaults (OpenAiProperties).
linkro:
  ai:
    module: ${LINKRO_AI_MODULE:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
      read-timeout: ${OPENAI_READ_TIMEOUT:8s}
      vision-read-timeout: ${OPENAI_VISION_READ_TIMEOUT:4s}
      explain-read-timeout: ${OPENAI_EXPLAIN_READ_TIMEOUT:6s}

# Recommendation (#74, API 8.1). Tie tolerances ("허용 폭") with their defaults; see docs/recommendation-74.md.
#   linkro.recommendation.fare-tolerance-won: 100       FARE: within this of the cheapest counts as a tie (TIME rule decides)
#   linkro.recommendation.distance-tolerance-m: 1000    DISTANCE: within this of the shortest counts as a tie
#   linkro.recommendation.in-progress-max-seconds: 60   one calculation per room at a time; a hold older than this is taken over (#98)
