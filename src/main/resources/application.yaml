spring:
  application:
    name: linkro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkro}
    username: ${DB_USERNAME:linkro}
    password: ${DB_PASSWORD:linkro}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

auth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    base-url: ${KAKAO_BASE_URL:https://kapi.kakao.com}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}
  jwt:
    secret: ${JWT_SECRET}
    # Spring Duration: 15m locally, 30m in production.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    # Each rotation restarts this lifetime from the time of reissue.
    refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Subway module. Unset values mean mock, and each mock logs a WARN at startup.
# - module: mock | graph. graph loads the subway graph at startup for real routes and fares
#   (production: environment variable LINKRO_SUBWAY_MODULE=graph).
# - congestion: mock | db. db reads congestion_stats for route congestion; turn it on after the production DB is
#   loaded (environment variable LINKRO_SUBWAY_CONGESTION=db). GET /congestion reads the DB either way.
# - holidays: comma-separated yyyy-MM-dd used as SUNDAY; defaults are in subway-holidays.properties.
# Route search (POST /routes/search): the Kakao REST API key comes only from the environment variable
# KAKAO_REST_API_KEY (production: ~/BE/.env, passed by docker-compose). Empty means INTERNAL routes only.
# Optional overrides (defaults shown): linkro.route.kakao.base-url=https://dapi.kakao.com,
#   call-timeout=3s, total-timeout=5s, retry-delay=200ms. See docs/route-search-81.md.
# - graph.* and fare.* apply only with module=graph; defaults are in subway-graph-defaults.properties
#   (docs/subway-graph-69.md lists them).
# linkro:
#   subway:
#     module: mock
#     congestion: mock
#     # 기본값은 subway-graph-defaults.properties 기준
#     graph:
#       dwell-seconds: 30
#       transfer-wait-seconds: 120
#       branch-transfer-wait-seconds: 120
#       default-branch-transfer-seconds: 120
#       branch-transfers:
#         - { station: 성수, line: "2", seconds: 19, meters: 23 }
#     fare:
#       base-fare: 1550

# AI module (#73). Unset or blank means mock, which logs a WARN at startup.
# - module: mock | openai (production: LINKRO_AI_MODULE=openai).
# - openai with a blank OPENAI_API_KEY or OPENAI_MODEL fails startup. There is no default model id.
linkro:
  ai:
    module: ${LINKRO_AI_MODULE:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
      read-timeout: ${OPENAI_READ_TIMEOUT:8s}
      vision-read-timeout: ${OPENAI_VISION_READ_TIMEOUT:4s}
