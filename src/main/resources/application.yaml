spring:
  application:
    name: linkro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkro}
    username: ${DB_USERNAME:linkro}
    password: ${DB_PASSWORD:linkro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
