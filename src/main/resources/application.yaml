spring:
  application:
    name: linkro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linkro}
    username: ${DB_USERNAME:linkro}
    password: ${DB_PASSWORD:linkro}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

auth:
  kakao:
    app-id: ${KAKAO_APP_ID}
    base-url: ${KAKAO_BASE_URL:https://kapi.kakao.com}
    connect-timeout: ${KAKAO_CONNECT_TIMEOUT:3s}
    read-timeout: ${KAKAO_READ_TIMEOUT:5s}
  jwt:
    secret: ${JWT_SECRET}
    # Spring Duration: 15m locally, 30m in production.
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    # Each rotation restarts this lifetime from the time of reissue.
    refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
