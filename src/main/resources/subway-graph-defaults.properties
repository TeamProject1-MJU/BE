# Defaults for linkro.subway.module=graph. Override in application settings or environment variables.

# API 14: travel_seconds as loaded, no dwell time. Extra waits are opt-in.
linkro.subway.graph.dwell-seconds=0
linkro.subway.graph.transfer-wait-seconds=0
linkro.subway.graph.branch-transfer-wait-seconds=0
linkro.subway.graph.default-branch-transfer-seconds=120

# Same-line transfer rows of Seoul Metro transfer distance/time data (data.go.kr 15044419, 2026-08-31).
# V11 excludes them because a station cannot connect to itself (ck_conn_not_self).
linkro.subway.graph.branch-transfers[0].station=성수
linkro.subway.graph.branch-transfers[0].line=2
linkro.subway.graph.branch-transfers[0].seconds=19
linkro.subway.graph.branch-transfers[0].meters=23
linkro.subway.graph.branch-transfers[1].station=신도림
linkro.subway.graph.branch-transfers[1].line=2
linkro.subway.graph.branch-transfers[1].seconds=68
linkro.subway.graph.branch-transfers[1].meters=81
linkro.subway.graph.branch-transfers[2].station=강동
linkro.subway.graph.branch-transfers[2].line=5
linkro.subway.graph.branch-transfers[2].seconds=16
linkro.subway.graph.branch-transfers[2].meters=19

# API 8.1 adult transit-card fare.
linkro.subway.fare.base-fare=1550
linkro.subway.fare.base-distance-m=10000
linkro.subway.fare.mid-limit-m=50000
linkro.subway.fare.mid-step-m=5000
linkro.subway.fare.long-step-m=8000
linkro.subway.fare.step-fare=100
