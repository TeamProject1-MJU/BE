# Defaults for linkro.subway.module=graph. Override in application settings or environment variables.

# travel_seconds (OA-12034) has no dwell or waiting time (API 14). These provisional corrections bring
# 강남->홍대입구 to 2,250 s vs Kakao 2,340 s and 둔촌동->길동 to 396 s vs Kakao 450 s (only 2 Kakao samples);
# recalibrate after ⑨. Set them to 0 for raw edge times.
linkro.subway.graph.dwell-seconds=30
linkro.subway.graph.transfer-wait-seconds=120
linkro.subway.graph.branch-transfer-wait-seconds=120
linkro.subway.graph.default-branch-transfer-seconds=120

# Same-line transfer rows of Seoul Metro transfer distance/time data (data.go.kr 15044419, 2026-08-31).
# V11 excludes them because a station cannot connect to itself (ck_conn_not_self).
linkro.subway.graph.branch-transfers[0].station=성수
linkro.subway.graph.branch-transfers[0].line=2
linkro.subway.graph.branch-transfers[0].seconds=19
linkro.subway.graph.branch-transfers[0].meters=23
linkro.subway.graph.branch-transfers[1].station=신도림
linkro.subway.graph.branch-transfers[1].line=2
linkro.subway.graph.branch-transfers[1].seconds=68
linkro.subway.graph.branch-transfers[1].meters=81
linkro.subway.graph.branch-transfers[2].station=강동
linkro.subway.graph.branch-transfers[2].line=5
linkro.subway.graph.branch-transfers[2].seconds=16
linkro.subway.graph.branch-transfers[2].meters=19

# Timetable routes only (#183): least time to change trains at a junction, the change being a transfer (TRANSFER step,
# transfer count). 카카오맵 shows 3 min at 응암 (순환 -> 순환, 5 searches) and 1 min at 강동 (하남 <-> 마천 and 본선 <-> 마천,
# 4 searches), 2026-11-20. The fixed-cost graph keeps branch-transfers above (강동 16 s).
linkro.subway.graph.timetable-changes[0].station=응암
linkro.subway.graph.timetable-changes[0].line=6
linkro.subway.graph.timetable-changes[0].seconds=180
linkro.subway.graph.timetable-changes[1].station=강동
linkro.subway.graph.timetable-changes[1].line=5
linkro.subway.graph.timetable-changes[1].seconds=60

# Timetable routes only (#185): a route needing fewer transfers may take at most this many seconds longer than the quickest
# one at the same leaving time (arrive-by) or the same arrival (leaving time search); past it the quicker route is taken
# although it needs more transfers. Provisional 900 s (15 min) until 카카오맵 samples settle it.
linkro.subway.graph.timetable-detour-cap-seconds=900

# API 8.1 adult transit-card fare.
linkro.subway.fare.base-fare=1550
linkro.subway.fare.base-distance-m=10000
linkro.subway.fare.mid-limit-m=50000
linkro.subway.fare.mid-step-m=5000
linkro.subway.fare.long-step-m=8000
linkro.subway.fare.step-fare=100
