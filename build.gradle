plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mju'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	postgresTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	postgresTestImplementation.extendsFrom testImplementation
	postgresTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	postgresTestImplementation 'org.testcontainers:testcontainers-postgresql'
	postgresTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.register('postgresTest', Test) {
	description = 'Runs Flyway migration tests on an isolated PostgreSQL 16 container; Docker is required.'
	group = 'verification'
	testClassesDirs = sourceSets.postgresTest.output.classesDirs
	classpath = sourceSets.postgresTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn tasks.named('postgresTest')
}

tasks.register('loadCongestion', JavaExec) {
	description = 'Loads AI congestion predictions into congestion_stats (PREDICTED). Needs DB_URL, DB_USERNAME, DB_PASSWORD and --args="--csv=... --manifest=...".'
	group = 'application'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.mju.linkro.subway.congestion.load.CongestionLoadTool'
}
