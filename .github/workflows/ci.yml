name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # DB tests explicitly use the test profile or per-test H2 properties.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # Testcontainers creates a disposable PostgreSQL 16 database, never the application DB.
      # No disabledWithoutDocker/optional flag: a missing Docker daemon fails this required step.
      - name: Run PostgreSQL migration tests
        run: ./gradlew postgresTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/reports/tests/postgresTest
            build/test-results/test
            build/test-results/postgresTest
          retention-days: 7
