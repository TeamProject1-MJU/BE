services:
  postgres:
    image: postgres:16
    container_name: linkro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkro}
      POSTGRES_USER: ${POSTGRES_USER:-linkro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkro}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - linkro-postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: linkro-app
    restart: unless-stopped
    # Longer than the Spring shutdown (requests, then up to 15s for @링크로 answers); the Docker default of 10s would kill it.
    stop_grace_period: 20s
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-linkro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-linkro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-linkro}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}}
      LINKRO_AI_MODULE: ${LINKRO_AI_MODULE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # OpenAI timeouts (optional, e.g. 6s). Unset or empty in ~/BE/.env keeps the application defaults
      # (connect 2s, read 8s, vision 4s, explain 6s): an empty value is not bound.
      OPENAI_CONNECT_TIMEOUT: ${OPENAI_CONNECT_TIMEOUT:-}
      OPENAI_READ_TIMEOUT: ${OPENAI_READ_TIMEOUT:-}
      OPENAI_VISION_READ_TIMEOUT: ${OPENAI_VISION_READ_TIMEOUT:-}
      OPENAI_EXPLAIN_READ_TIMEOUT: ${OPENAI_EXPLAIN_READ_TIMEOUT:-}
      # Subway switches (optional). Unset or empty in ~/BE/.env means mock, as before.
      LINKRO_SUBWAY_MODULE: ${LINKRO_SUBWAY_MODULE:-mock}
      LINKRO_SUBWAY_CONGESTION: ${LINKRO_SUBWAY_CONGESTION:-mock}
      # Kakao REST API key for POST /routes/search (optional). Empty means INTERNAL routes only.
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # data.go.kr "Decoding" key for the KASI holiday refresh (optional). Empty means subway-holidays.properties only.
      KASI_SPECIAL_DAY_KEY: ${KASI_SPECIAL_DAY_KEY:-}
      # Seoul Open Data realtime subway arrival key for GET /stations/{id}/arrivals (optional). Empty means DISABLED.
      SEOUL_ARRIVAL_API_KEY: ${SEOUL_ARRIVAL_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  linkro-postgres-data:
